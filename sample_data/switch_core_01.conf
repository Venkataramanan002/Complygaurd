!
! Fortress Enterprise — Core Switch 01
! Cisco Catalyst 9500 — IOS-XE 17.6
! Location: Data Center Rack A01
!
hostname CORE-SW-01
!
enable secret 9 $9$encrypted_hash_here
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin privilege 15 secret 9 $9$admin_hash
username netops privilege 10 secret 9 $9$netops_hash
!
! ── VLANs ─────────────────────────────────────────────────────────────
!
vlan 10
 name SERVERS
!
vlan 20
 name USERS
!
vlan 30
 name MANAGEMENT
!
vlan 40
 name DMZ
!
vlan 50
 name DATABASE
!
vlan 60
 name VOIP
!
vlan 70
 name IOT_DEVICES
!
vlan 80
 name GUEST_WIFI
!
vlan 99
 name NATIVE_UNUSED
!
vlan 100
 name SECURITY_CAMERAS
!
vlan 200
 name DEVELOPMENT
!
vlan 300
 name STAGING
!
vlan 999
 name QUARANTINE
!
! ── Spanning Tree ─────────────────────────────────────────────────────
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50 root primary
spanning-tree vlan 60,70,80,100 root secondary
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree loopguard default
!
! ── EtherChannel to Core Switch 02 ────────────────────────────────────
!
interface Port-channel1
 description PEER-LINK to CORE-SW-02 Po1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,99,100,200,300,999
 switchport trunk native vlan 99
!
interface GigabitEthernet1/0/47
 description PEER-LINK to CORE-SW-02 Gi1/0/47
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,99,100,200,300,999
 switchport trunk native vlan 99
 channel-group 1 mode active
!
interface GigabitEthernet1/0/48
 description PEER-LINK to CORE-SW-02 Gi1/0/48
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,99,100,200,300,999
 switchport trunk native vlan 99
 channel-group 1 mode active
!
! ── Uplinks to Core Routers ──────────────────────────────────────────
!
interface TenGigabitEthernet1/1/1
 description Uplink to CORE-RTR-01 Gi0/0
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50
 switchport trunk native vlan 99
!
interface TenGigabitEthernet1/1/2
 description Uplink to CORE-RTR-02 Gi0/0
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50
 switchport trunk native vlan 99
!
! ── Uplink to Firewall ───────────────────────────────────────────────
!
interface TenGigabitEthernet1/1/3
 description Uplink to PA-FW-01 eth1/7
 switchport mode trunk
 switchport trunk allowed vlan 10,20,40,50
 switchport trunk native vlan 99
!
! ── Downlinks to Distribution Switches ────────────────────────────────
!
interface GigabitEthernet1/0/1
 description Downlink to DIST-SW-01 Gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,60,200
 switchport trunk native vlan 99
!
interface GigabitEthernet1/0/2
 description Downlink to DIST-SW-02 Gi0/1
 switchport mode trunk
 switchport trunk allowed vlan 40,50,70,80,100,300
 switchport trunk native vlan 99
!
! ── Server Access Ports ──────────────────────────────────────────────
!
interface GigabitEthernet1/0/3
 description SRV-WEB-01
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet1/0/4
 description SRV-WEB-02
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet1/0/5
 description SRV-APP-01
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 spanning-tree portfast
!
interface GigabitEthernet1/0/6
 description SRV-DB-PRIMARY
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet1/0/7
 description SRV-DB-REPLICA
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet1/0/8
 description SRV-MONITORING
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
!
interface GigabitEthernet1/0/9
 description SRV-BACKUP
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface GigabitEthernet1/0/10
 description DMZ-WEB-01
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 spanning-tree portfast
!
interface GigabitEthernet1/0/11
 description DMZ-MAIL-01
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 spanning-tree portfast
!
interface GigabitEthernet1/0/12
 description DMZ-DNS-01
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
!
! ── SVIs (Layer 3 Interfaces) ────────────────────────────────────────
!
interface Vlan10
 description SERVERS Gateway
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 10.30.30.10
!
interface Vlan20
 description USERS Gateway
 ip address 10.20.20.1 255.255.255.0
 ip helper-address 10.30.30.10
!
interface Vlan30
 description MANAGEMENT Gateway
 ip address 10.30.30.1 255.255.255.0
!
interface Vlan40
 description DMZ Gateway
 ip address 172.16.10.1 255.255.255.0
!
interface Vlan50
 description DATABASE Gateway
 ip address 10.50.50.1 255.255.255.0
!
interface Vlan60
 description VOIP Gateway
 ip address 10.60.60.1 255.255.255.0
 ip helper-address 10.30.30.10
!
interface Vlan70
 description IOT Gateway
 ip address 10.70.70.1 255.255.255.0
!
interface Vlan80
 description GUEST_WIFI Gateway
 ip address 10.80.80.1 255.255.255.0
!
interface Vlan100
 description SECURITY_CAMERAS Gateway
 ip address 10.100.100.1 255.255.255.0
!
interface Vlan200
 description DEVELOPMENT Gateway
 ip address 10.200.200.1 255.255.255.0
!
interface Vlan300
 description STAGING Gateway
 ip address 10.44.44.1 255.255.255.0
!
! ── ACLs ─────────────────────────────────────────────────────────────
!
ip access-list extended VLAN50-IN
 remark Allow app servers to database
 permit tcp 10.10.10.0 0.0.0.255 10.50.50.0 0.0.0.255 eq 3306
 permit tcp 10.10.10.0 0.0.0.255 10.50.50.0 0.0.0.255 eq 5432
 remark Allow management access
 permit tcp 10.30.30.0 0.0.0.255 10.50.50.0 0.0.0.255 eq 22
 remark Deny everything else to DB VLAN
 deny ip any 10.50.50.0 0.0.0.255
 permit ip any any
!
ip access-list extended GUEST-RESTRICT
 remark Guests can only reach internet
 permit tcp 10.80.80.0 0.0.0.255 any eq 80
 permit tcp 10.80.80.0 0.0.0.255 any eq 443
 permit udp 10.80.80.0 0.0.0.255 any eq 53
 deny ip 10.80.80.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.80.80.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.80.80.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip any any
!
ip access-list extended IOT-RESTRICT
 remark IOT devices restricted to their VLAN + NTP
 permit udp 10.70.70.0 0.0.0.255 any eq 123
 permit tcp 10.70.70.0 0.0.0.255 any eq 443
 deny ip 10.70.70.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip any any
!
! ── Static Routes ────────────────────────────────────────────────────
!
ip route 0.0.0.0 0.0.0.0 10.10.10.254
ip route 203.0.113.0 255.255.255.0 10.10.10.254
!
! ── SNMP / Monitoring ────────────────────────────────────────────────
!
snmp-server community fortress-ro RO
snmp-server location DataCenter-RackA01
snmp-server contact netops@fortress-enterprise.local
!
! ── NTP ──────────────────────────────────────────────────────────────
!
ntp server 10.30.30.10
!
! ── Logging ──────────────────────────────────────────────────────────
!
logging host 10.30.30.20
logging trap informational
!
line console 0
 login local
line vty 0 15
 login local
 transport input ssh
!
end
