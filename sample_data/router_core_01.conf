!
! Fortress Enterprise — Core Router 01
! Cisco ISR 4451-X — IOS-XE 17.6
! Location: Data Center Rack A02
! Role: Primary WAN router, OSPF Area 0 backbone, BGP peering with ISP
!
hostname CORE-RTR-01
!
enable secret 9 $9$encrypted_hash
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username admin privilege 15 secret 9 $9$admin_hash
username netops privilege 10 secret 9 $9$netops_hash
!
! ── Loopback (Router ID) ─────────────────────────────────────────────
!
interface Loopback0
 description Router-ID / OSPF / BGP source
 ip address 1.1.1.1 255.255.255.255
!
! ── WAN Interface (ISP Uplink) ───────────────────────────────────────
!
interface GigabitEthernet0/0/0
 description WAN to ISP-PRIMARY (AS 65000)
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 ip access-group WAN-INBOUND in
 bandwidth 1000000
 speed 1000
 duplex full
 no shutdown
!
! ── LAN Uplink to Core Switch 01 ────────────────────────────────────
!
interface GigabitEthernet0/0/1
 description Link to CORE-SW-01 Te1/1/1
 ip address 10.10.10.254 255.255.255.0
 ip nat inside
 ip ospf 1 area 0
 bandwidth 10000000
 no shutdown
!
! ── Link to Core Router 02 (iBGP / OSPF) ────────────────────────────
!
interface GigabitEthernet0/0/2
 description Peer to CORE-RTR-02 Gi0/0/2
 ip address 10.255.0.1 255.255.255.252
 ip ospf 1 area 0
 bandwidth 10000000
 no shutdown
!
! ── Link to Palo Alto Firewall ───────────────────────────────────────
!
interface GigabitEthernet0/0/3
 description Link to PA-FW-01 ethernet1/1
 ip address 192.168.100.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
! ── DMZ Transit ──────────────────────────────────────────────────────
!
interface GigabitEthernet0/1/0
 description DMZ transit to PA-FW-01 ethernet1/3
 ip address 172.16.10.254 255.255.255.0
 ip nat inside
 ip ospf 1 area 0
 no shutdown
!
! ── VPN Tunnel to Branch Office ──────────────────────────────────────
!
interface Tunnel0
 description IPSEC-VPN to BRANCH-RTR-01
 ip address 10.255.1.1 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.2
 tunnel mode ipsec ipv4
 ip ospf 1 area 1
!
! ── Management Interface ─────────────────────────────────────────────
!
interface GigabitEthernet0/1/1
 description Management OOB
 ip address 192.168.200.1 255.255.255.0
 no shutdown
!
! ── OSPF Configuration ───────────────────────────────────────────────
!
router ospf 1
 router-id 1.1.1.1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 192.168.100.0 0.0.0.3 area 0
 network 172.16.10.0 0.0.0.255 area 0
 network 10.255.1.0 0.0.0.3 area 1
 passive-interface GigabitEthernet0/0/0
 passive-interface GigabitEthernet0/1/1
 default-information originate
!
! ── BGP Configuration ────────────────────────────────────────────────
!
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65000
 neighbor 203.0.113.1 description ISP-PRIMARY-UPSTREAM
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 description CORE-RTR-02-iBGP
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 10.255.0.2 next-hop-self
 !
 address-family ipv4
  network 10.10.10.0 mask 255.255.255.0
  network 172.16.10.0 mask 255.255.255.0
  network 10.50.50.0 mask 255.255.255.0
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 route-map ISP-IN in
  neighbor 203.0.113.1 route-map ISP-OUT out
  neighbor 10.255.0.2 activate
 exit-address-family
!
! ── NAT Configuration ────────────────────────────────────────────────
!
ip nat inside source list NAT-POOL interface GigabitEthernet0/0/0 overload
ip nat inside source static tcp 172.16.10.10 443 203.0.113.2 443
ip nat inside source static tcp 172.16.10.10 80 203.0.113.2 80
ip nat inside source static tcp 172.16.10.20 25 203.0.113.2 25
!
! ── ACLs ─────────────────────────────────────────────────────────────
!
ip access-list extended WAN-INBOUND
 remark Anti-spoofing
 deny ip 10.0.0.0 0.255.255.255 any
 deny ip 172.16.0.0 0.15.255.255 any
 deny ip 192.168.0.0 0.0.255.255 any
 remark Allow established connections
 permit tcp any any established
 remark Allow HTTPS/HTTP to DMZ
 permit tcp any host 203.0.113.2 eq 443
 permit tcp any host 203.0.113.2 eq 80
 remark Allow SMTP to mail server
 permit tcp any host 203.0.113.2 eq 25
 remark Allow VPN
 permit esp any any
 permit udp any any eq 500
 permit udp any any eq 4500
 remark Allow ICMP
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 remark Allow BGP from ISP
 permit tcp host 203.0.113.1 host 203.0.113.2 eq 179
 permit tcp host 203.0.113.1 eq 179 host 203.0.113.2
 remark Deny all other inbound
 deny ip any any log
!
ip access-list extended NAT-POOL
 permit ip 10.10.10.0 0.0.0.255 any
 permit ip 10.20.20.0 0.0.0.255 any
 permit ip 10.50.50.0 0.0.0.255 any
 permit ip 10.200.200.0 0.0.0.255 any
!
ip access-list extended MGMT-ACCESS
 permit tcp 10.30.30.0 0.0.0.255 any eq 22
 permit tcp 192.168.200.0 0.0.0.255 any eq 22
 deny ip any any
!
! ── Route Maps ───────────────────────────────────────────────────────
!
route-map ISP-IN permit 10
 set local-preference 200
!
route-map ISP-OUT permit 10
 match ip address prefix-list ADVERTISE-NETS
!
ip prefix-list ADVERTISE-NETS seq 10 permit 203.0.113.0/24
ip prefix-list ADVERTISE-NETS seq 20 permit 10.10.10.0/24
!
! ── Static Routes ────────────────────────────────────────────────────
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 10.20.20.0 255.255.255.0 10.10.10.1
ip route 10.50.50.0 255.255.255.0 10.10.10.1
ip route 10.30.30.0 255.255.255.0 10.10.10.1
ip route 10.60.60.0 255.255.255.0 10.10.10.1
!
! ── Monitoring ───────────────────────────────────────────────────────
!
snmp-server community fortress-ro RO
snmp-server location DataCenter-RackA02
snmp-server contact netops@fortress-enterprise.local
!
ntp server 10.30.30.10
logging host 10.30.30.20
logging trap informational
!
line console 0
 login local
line vty 0 15
 login local
 transport input ssh
 access-class MGMT-ACCESS in
!
end
