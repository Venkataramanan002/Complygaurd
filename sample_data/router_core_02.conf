!
! Fortress Enterprise — Core Router 02
! Cisco ISR 4451-X — IOS-XE 17.6
! Location: Data Center Rack B02
! Role: Secondary WAN router, OSPF Area 0 backbone, BGP peering with secondary ISP
!
hostname CORE-RTR-02
!
enable secret 9 $9$encrypted_hash
!
aaa new-model
aaa authentication login default local
username admin privilege 15 secret 9 $9$admin_hash
!
! ── Loopback ─────────────────────────────────────────────────────────
!
interface Loopback0
 description Router-ID
 ip address 2.2.2.2 255.255.255.255
!
! ── WAN Interface (Secondary ISP) ────────────────────────────────────
!
interface GigabitEthernet0/0/0
 description WAN to ISP-SECONDARY (AS 65002)
 ip address 198.51.100.2 255.255.255.252
 ip nat outside
 ip access-group WAN2-INBOUND in
 bandwidth 500000
 speed 1000
 duplex full
 no shutdown
!
! ── LAN Uplink to Core Switch 02 ────────────────────────────────────
!
interface GigabitEthernet0/0/1
 description Link to CORE-SW-02 Te1/1/2
 ip address 10.20.20.254 255.255.255.0
 ip nat inside
 ip ospf 1 area 0
 bandwidth 10000000
 no shutdown
!
! ── Link to Core Router 01 (iBGP / OSPF) ────────────────────────────
!
interface GigabitEthernet0/0/2
 description Peer to CORE-RTR-01 Gi0/0/2
 ip address 10.255.0.2 255.255.255.252
 ip ospf 1 area 0
 bandwidth 10000000
 no shutdown
!
! ── Link to Palo Alto Firewall ───────────────────────────────────────
!
interface GigabitEthernet0/0/3
 description Link to PA-FW-01 ethernet1/2
 ip address 192.168.100.5 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
! ── Branch VPN ───────────────────────────────────────────────────────
!
interface Tunnel1
 description IPSEC-VPN to BRANCH-RTR-02
 ip address 10.255.2.1 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 203.0.113.100
 tunnel mode ipsec ipv4
 ip ospf 1 area 2
!
! ── OSPF ─────────────────────────────────────────────────────────────
!
router ospf 1
 router-id 2.2.2.2
 network 10.20.20.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 192.168.100.4 0.0.0.3 area 0
 network 10.255.2.0 0.0.0.3 area 2
 passive-interface GigabitEthernet0/0/0
 default-information originate metric 200
!
! ── BGP ──────────────────────────────────────────────────────────────
!
router bgp 65001
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 65002
 neighbor 198.51.100.1 description ISP-SECONDARY-UPSTREAM
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 description CORE-RTR-01-iBGP
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.1 next-hop-self
 !
 address-family ipv4
  network 10.20.20.0 mask 255.255.255.0
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map ISP2-IN in
  neighbor 198.51.100.1 route-map ISP2-OUT out
  neighbor 10.255.0.1 activate
 exit-address-family
!
! ── NAT ──────────────────────────────────────────────────────────────
!
ip nat inside source list NAT-POOL2 interface GigabitEthernet0/0/0 overload
!
! ── ACLs ─────────────────────────────────────────────────────────────
!
ip access-list extended WAN2-INBOUND
 deny ip 10.0.0.0 0.255.255.255 any
 deny ip 172.16.0.0 0.15.255.255 any
 deny ip 192.168.0.0 0.0.255.255 any
 permit tcp any any established
 permit esp any any
 permit udp any any eq 500
 permit udp any any eq 4500
 permit icmp any any echo-reply
 permit tcp host 198.51.100.1 host 198.51.100.2 eq 179
 deny ip any any log
!
ip access-list extended NAT-POOL2
 permit ip 10.20.20.0 0.0.0.255 any
 permit ip 10.30.30.0 0.0.0.255 any
!
! ── Route Maps ───────────────────────────────────────────────────────
!
route-map ISP2-IN permit 10
 set local-preference 100
!
route-map ISP2-OUT permit 10
 match ip address prefix-list ADVERTISE-NETS2
!
ip prefix-list ADVERTISE-NETS2 seq 10 permit 10.20.20.0/24
!
! ── Static Routes ────────────────────────────────────────────────────
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1 200
ip route 10.10.10.0 255.255.255.0 10.20.20.1
ip route 10.50.50.0 255.255.255.0 10.20.20.1
!
snmp-server community fortress-ro RO
ntp server 10.30.30.10
logging host 10.30.30.20
!
line console 0
 login local
line vty 0 15
 login local
 transport input ssh
!
end
