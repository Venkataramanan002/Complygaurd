!
! Fortress Enterprise — Distribution Switch 01
! Cisco Catalyst 9300 — IOS-XE 17.6
! Location: Building A, Floor 2
!
hostname DIST-SW-01
!
enable secret 9 $9$encrypted_hash
!
aaa new-model
aaa authentication login default local
username admin privilege 15 secret 9 $9$admin_hash
!
! ── VLANs ─────────────────────────────────────────────────────────────
!
vlan 10
 name SERVERS
!
vlan 20
 name USERS
!
vlan 30
 name MANAGEMENT
!
vlan 60
 name VOIP
!
vlan 200
 name DEVELOPMENT
!
vlan 999
 name QUARANTINE
!
! ── Spanning Tree ─────────────────────────────────────────────────────
!
spanning-tree mode rapid-pvst
spanning-tree vlan 20,60,200 root primary
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
! ── Uplink to Core Switch 01 ─────────────────────────────────────────
!
interface GigabitEthernet0/1
 description Uplink to CORE-SW-01 Gi1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,60,200
 switchport trunk native vlan 99
!
! ── Uplink to Core Switch 02 ─────────────────────────────────────────
!
interface GigabitEthernet0/2
 description Uplink to CORE-SW-02 Gi1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,60,200
 switchport trunk native vlan 99
!
! ── User Access Ports ────────────────────────────────────────────────
!
interface GigabitEthernet0/3
 description USER-PC-201
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet0/4
 description USER-PC-202
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface GigabitEthernet0/5
 description USER-PC-203
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
!
interface GigabitEthernet0/6
 description USER-PC-204
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface GigabitEthernet0/7
 description USER-PC-205
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface GigabitEthernet0/8
 description VOIP-PHONE-201
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
!
interface GigabitEthernet0/9
 description VOIP-PHONE-202
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
!
interface GigabitEthernet0/10
 description DEV-WORKSTATION-01
 switchport mode access
 switchport access vlan 200
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 spanning-tree portfast
!
interface GigabitEthernet0/11
 description DEV-WORKSTATION-02
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
!
interface GigabitEthernet0/12
 description MGMT-CONSOLE-01
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
! ── SVI ──────────────────────────────────────────────────────────────
!
interface Vlan30
 ip address 10.30.30.5 255.255.255.0
!
! ── Routing ──────────────────────────────────────────────────────────
!
ip route 0.0.0.0 0.0.0.0 10.30.30.1
!
! ── ACLs ─────────────────────────────────────────────────────────────
!
ip access-list extended DEV-RESTRICT
 remark Dev VLAN cannot reach production DB
 deny tcp 10.200.200.0 0.0.0.255 10.50.50.0 0.0.0.255 eq 3306
 deny tcp 10.200.200.0 0.0.0.255 10.50.50.0 0.0.0.255 eq 5432
 permit ip any any
!
snmp-server community fortress-ro RO
ntp server 10.30.30.10
logging host 10.30.30.20
!
line console 0
 login local
line vty 0 15
 login local
 transport input ssh
!
end
