# JWT_SECRET and DEFAULT_ADMIN_PASSWORD are read from the .env file in this
# directory (docker compose substitutes them automatically). Both are required.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: firewall-backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./firewall.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"
    volumes:
      - ./firewall.db:/app/firewall.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    container_name: firewall-frontend
    depends_on:
      - backend
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Optional single-container black-box mode running both backend and frontend
  blackbox:
    profiles: ["blackbox"]
    build:
      context: .
      dockerfile: Dockerfile
      target: all-in-one-runtime
    container_name: firewall-blackbox
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./firewall.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?set DEFAULT_ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./firewall.db:/app/firewall.db
    restart: unless-stopped
